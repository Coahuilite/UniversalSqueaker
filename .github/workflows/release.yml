name: Release

# Push a SemVer tag (vX.Y.Z, vX.Y.Z-rcN) and this publishes the US mod package players download.
#
# US ships NO audio and NO copy of FerriteLib.UiKit.dll: it is a routing kernel that compiles
# against the carrier mod (coahuilite.ferritelib) by a sibling relative path. So this pipeline
# acquires the approved carrier into the sibling path (same trick as ci.yml), builds US Release, and stages a
# package that must contain exactly UniversalSqueaker.dll and never a second carrier.
#
# Version identity is set in the repository, not injected here: the release commit must already
# carry a clean <Version> and a matching About.xml <modVersion>. The csproj pins
# <Version> explicitly, so `-p:VersionSuffix=` does NOT clear a -dev suffix (measured) - the
# release-metadata gate below is what refuses a -dev tag, and it fails the build rather than
# silently shipping a mislabelled DLL.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # creating a GitHub Release

jobs:
  release:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ runner.temp }}/us-nuget
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ancestry check below needs origin/main, not a depth-1 clone

      - name: Require approved FerriteLib 0.8 release coordinates
        shell: pwsh
        env:
          FL_CARRIER_REPOSITORY: ${{ vars.FERRITELIB_CARRIER_REPOSITORY }}
          FL_CARRIER_TAG: ${{ vars.FERRITELIB_CARRIER_TAG }}
          FL_CARRIER_COMMIT: ${{ vars.FERRITELIB_CARRIER_COMMIT }}
        run: ./scripts/require-ferritelib-ci-input.ps1

      # Pinned at the approved full commit - NEVER the default branch (same contract as ci.yml: the source tree
      # carries the harness support and gate 6's pairing commit; the compile payload comes from the
      # Release asset acquired below).
      - name: Checkout the approved FerriteLib carrier commit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FERRITELIB_CARRIER_REPOSITORY }}
          ref: ${{ vars.FERRITELIB_CARRIER_COMMIT }}
          path: ci-ferritelib

      - name: Cache NuGet downloads (not build outputs)
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-us-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.*') }}
          restore-keys: ${{ runner.os }}-us-nuget-

      - name: Cache the exact carrier download
        uses: actions/cache@v4
        with:
          path: dist/carrier-download-cache
          key: ${{ runner.os }}-us-carrier-${{ vars.FERRITELIB_CARRIER_REPOSITORY }}-${{ vars.FERRITELIB_CARRIER_TAG }}-${{ vars.FERRITELIB_CARRIER_COMMIT }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Must match ci.yml (see the note there for why 10.0.x is the pinned major).
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify the tag is a release of this exact commit on main
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG

          # 1. Shape. Prereleases are rc-only: vBASE-rcN (N>=1) for trials, bare vBASE for the final.
          #    Other suffixes (-dev, -alpha, -fix1, rc0) are rejected so the release page speaks
          #    exactly two dialects and rcN stays SemVer-parseable (rc1 < rc2 < BASE).
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-rc([1-9]\d*))?$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN (N >= 1): $tag"
          }
          $base = $tag -replace '^v', '' -replace '-rc.*$', ''

          # 2. The repo's product version must equal the tag base, with no -dev suffix. This is the
          #    version-axis lock (MEMORY.md "First cloud upload"): csproj <Version>, About.xml <modVersion> and
          #    the tag must agree, and none may still say -dev. check-pack-readiness enforces the same
          #    invariants; doing it here too fails before any build minutes are spent.
          [xml]$csproj = Get-Content -LiteralPath 'Source/UniversalSqueaker/UniversalSqueaker.csproj' -Raw
          $version = $csproj.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -ne $base) { throw "csproj <Version>$version does not match tag base v$base. Bump the version in the release commit, do not rename the artifact." }
          [xml]$about = Get-Content -LiteralPath 'About/About.xml' -Raw
          $modVersion = $about.SelectSingleNode('/ModMetaData/modVersion').InnerText.Trim()
          if ($modVersion -ne $base) { throw "About.xml <modVersion>$modVersion does not match tag base v$base." }

          # 3. The tag must name a commit that is in origin/main history (a release off-trunk is a
          #    build of code nobody reads).
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          $commit = (git rev-parse 'HEAD^{commit}').Trim()
          git merge-base --is-ancestor $commit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag commit $commit is not in origin/main history. Merge to main, then tag." }

      - name: Privacy gate on the complete reachable release history
        shell: pwsh
        run: ./scripts/privacy-audit.ps1 -FullHistory

      # Same acquisition contract as ci.yml (read its comment): the carrier SOURCE is staged for the
      # sibling reads (licence + stub-coverage scanner) and the COMPILE PAYLOAD is the verified CI-built
      # release asset - never a second FerriteLib runtime build (single carrier). Step outputs carry the
      # pairing facts (tag, commit, DLL hash) into the release body below.
      - name: Acquire the FerriteLib release carrier (approved 0.8 coordinates)
        id: carrier
        shell: pwsh
        env:
          FL_CARRIER_REPOSITORY: ${{ vars.FERRITELIB_CARRIER_REPOSITORY }}
          FL_CARRIER_TAG: ${{ vars.FERRITELIB_CARRIER_TAG }}
          FL_CARRIER_COMMIT: ${{ vars.FERRITELIB_CARRIER_COMMIT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sibling = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'ferritelib'
          New-Item -ItemType Directory -Path $sibling -Force | Out-Null
          Get-ChildItem -LiteralPath 'ci-ferritelib' -Force |
            Where-Object { $_.Name -ne '.git' } |
            Copy-Item -Destination $sibling -Recurse -Force
          $head = (git -C ci-ferritelib rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:FL_CARRIER_COMMIT) { throw 'Pinned FerriteLib checkout identity differs.' }
          ./scripts/acquire-ferritelib-carrier.ps1 -Repo $env:FL_CARRIER_REPOSITORY -Tag $env:FL_CARRIER_TAG -SourceCheckout 'ci-ferritelib' -SiblingRoot $sibling -DownloadCacheDirectory dist/carrier-download-cache
          # US never authors or builds the carrier: nothing in this workflow writes into ci-ferritelib/.

      - name: Verify current groups (stable gate IDs; archived gate16 separate)
        shell: pwsh
        # Explicit carrier selection, same reason and same path as ci.yml: the acquisition step above
        # staged the verified release-asset DLL at the sibling path, and resolve-carrier no longer has a
        # default.
        run: ./scripts/verify-local.ps1 -FerriteLibSourceRoot ci-ferritelib -FerriteLibArtifactPath '../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll'

      - name: Build the release payload
        shell: pwsh
        # Build the final Release input; staging independently checks its configuration and identity.
        run: |
          $log = 'dist/verify/release-payload.log'
          @('configuration=Release', 'carrier=../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll', ('commit=' + (git rev-parse HEAD))) | Set-Content -LiteralPath $log
          dotnet build Source/UniversalSqueaker/UniversalSqueaker.csproj -c Release --no-restore --disable-build-servers --no-incremental --nologo '-p:FerriteLibArtifactPath=../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll' *>> $log
          $code = $LASTEXITCODE
          ('exit=' + $code) | Add-Content -LiteralPath $log
          Get-Content -LiteralPath $log -Tail 16
          if ($code -ne 0) { throw "Final Release build failed; full log $log" }

      - name: Pack-readiness with release metadata (version axis + non-placeholder description)
        shell: pwsh
        run: ./scripts/check-pack-readiness.ps1 -SkipVerify -RequireReleaseMetadata -FerriteLibArtifactPath '../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll'

      - name: Stage the release asset
        id: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $base = $tag -replace '^v', '' -replace '-rc.*$', ''
          $commit = (git rev-parse --short=12 HEAD).Trim()
          $stageDir = 'dist/github/UniversalSqueaker'
          # One archive writer, in the engine (FL→US round 2 S4). The shape the release body promises -
          # exactly one top-level UniversalSqueaker/ folder, so unzipping into Mods/ yields a valid mod
          # directory - and the entry timestamps both come from here now: every entry is stamped with
          # this commit's author date, which is what makes the digest below a check another run can
          # reproduce instead of a receipt only this run believes. The asset name stays
          # UniversalSqueaker-<tag>.zip because that name is a reconciliation target.
          ./scripts/stage-package.ps1 -StageDir $stageDir -VersionLabel $base -BuildFlavor release `
            -CommitLabel $commit -RequireReleaseIdentity -CreateZip -ArchiveName "UniversalSqueaker-$tag" `
            -FerriteLibArtifactPath '../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll'
          $zip = "dist/github/UniversalSqueaker-$tag.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Expected asset was not produced: $zip" }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "asset=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Write the release body
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_SHA256: ${{ steps.pack.outputs.sha256 }}
          ASSET_COMMIT: ${{ steps.pack.outputs.commit }}
          FL_REPOSITORY: ${{ vars.FERRITELIB_CARRIER_REPOSITORY }}
          FL_TAG: ${{ steps.carrier.outputs.fl-tag }}
          FL_COMMIT: ${{ steps.carrier.outputs.fl-commit }}
          FL_DLL_SHA256: ${{ steps.carrier.outputs.fl-dll-sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $isRc = $tag -match '-rc[1-9]\d*$'
          $trialNote = if ($isRc) { "This is a **release candidate** for RimWorld 1.6. Report issues with the version identity below." } else { "This is the stable release for RimWorld 1.6." }
          $notesPath = "docs/releases/$tag.md"
          $preparedNotes = if (Test-Path -LiteralPath $notesPath) { Get-Content -LiteralPath $notesPath -Raw } else { '' }
          # rc delta: show what changed since the previous tag so testers know the trial delta.
          $all = @(& git tag --list 'v*' --sort=v:refname)
          $idx = [Array]::IndexOf($all, $tag)
          if ($idx -gt 0) { $commits = @(& git log --oneline "$($all[$idx-1])..$tag" 2>$null) } else { $commits = @(& git log --oneline -10 $tag 2>$null) }
          $delta = if ($commits.Count -gt 0) { ($commits | ForEach-Object { "- $_" }) -join "`n" } else { "- (no recorded commits in range)" }
          $body = @"
          $trialNote

          Universal Squeaker is a voice-pack routing kernel for RimWorld 1.6. It ships no audio of its own: it attaches third-party voice packs to pawns by race/xenotype domain, with declared behavior contracts, layered configuration, distance attenuation and a camera indicator.

          ## Installing

          1. Install **[Harmony](https://steamcommunity.com/sharedfiles/filedetails/?id=2009463077)** (``brrainz.harmony``) as a separate prerequisite mod.
          2. Install the paired prerequisite **FerriteLib** release ``$env:FL_TAG`` (``coahuilite.ferritelib``) from https://github.com/$env:FL_REPOSITORY/releases - this build is compiled against that carrier.
          3. Unzip this archive **directly into** ``RimWorld/Mods/`` (it contains a top-level ``UniversalSqueaker`` folder).
          4. Enable all three, with Harmony and FerriteLib before Universal Squeaker. US bundles neither ``0Harmony.dll`` nor ``FerriteLib.UiKit.dll``; keep one external provider for each prerequisite.

          ## Version identity

          | | |
          |---|---|
          | Release | ``$env:RELEASE_TAG`` |
          | Built from commit | ``$env:ASSET_COMMIT`` |
          | Asset SHA-256 | ``$env:ASSET_SHA256`` |
          | FerriteLib dependency | ``$env:FL_TAG`` (built from ``$env:FL_COMMIT``) |
          | FerriteLib.UiKit.dll SHA-256 | ``$env:FL_DLL_SHA256`` |

          ## Notes

          - Uninstalling is save-safe: no permanent data is written into saves, and settings and profiles live in the RimWorld ``Config/`` folder.
          - The paired baseline passed overall internal trials. Coverage of individual actions, IME and native Config remains limited.

          $preparedNotes

          ## Changes

          $delta
          "@
          $body | Out-File -FilePath release-body.md -Encoding utf8NoBOM

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          # Glob, not a literal name: the zip is UniversalSqueaker-<tag>.zip (series convention,
          # see the staging step) and exactly one such zip exists in dist/github per run.
          files: dist/github/UniversalSqueaker-v*.zip
      - name: Preserve complete verification logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/verify/**
          if-no-files-found: ignore

      # Post-push closure (MEMORY.md "First cloud upload" push-order entry): the six-point platform reconciliation reuses the
      # carrier repo's scripts/verify-release.ps1 (-Tag -Repo -AssetPrefix UniversalSqueaker). That
      # step runs AFTER the first push is authorized and is intentionally not wired here, because US
      # does not yet carry its own copy of that script; see TODO.md "First cloud upload preparation".
