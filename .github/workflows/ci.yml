name: CI

# Development evidence: ordinary RW1.6/net472 against immutable public FL0.9 source.
# Native1.7 also builds locally against explicitly supplied proprietary references; those
# references are not available to GitHub and must never be uploaded to make this job green.
# release.yml keeps the separate published-carrier acquisition and release-pairing gates.
on:
  push:
    branches: [main, '0.6.x']
  pull_request:
    branches: [main, '0.6.x']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Public product-equivalent base of local5d12091 (the latter adds only adopted docs).
      # Full commit, never a branch or tag lookup; each CI build records its own actual input.
      FL_CARRIER_COMMIT: 6d7533212096dd7bfad3fe253330838149f4e210
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact public FL0.9 source
        uses: actions/checkout@v4
        with:
          repository: Coahuilite/FerriteLib
          ref: ${{ env.FL_CARRIER_COMMIT }}
          path: ci-ferritelib
      - name: Select the runner-local NuGet download cache
        shell: pwsh
        run: '"NUGET_PACKAGES=$env:RUNNER_TEMP/us-nuget" >> $env:GITHUB_ENV'
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-us-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.*') }}
          restore-keys: ${{ runner.os }}-us-nuget-
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the ordinary FL0.9 compiler input from that commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git -C ci-ferritelib rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:FL_CARRIER_COMMIT -or $head -notmatch '^[0-9a-f]{40}$') { throw 'FL source is not the selected immutable public commit.' }
          if (@(git -C ci-ferritelib status --porcelain).Count) { throw 'FL source must be clean before compilation.' }
          dotnet build ci-ferritelib/Source/FerriteLib.UiKit/FerriteLib.UiKit.csproj -c Release --no-incremental -p:FerriteTestHooks=false --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary FL0.9 net472 Release failed.' }
          $carrier = 'ci-ferritelib/dist/build/Release/FerriteLib.UiKit.dll'
          $info = ./scripts/read-assembly-stamp.ps1 -Path $carrier -AttributeName AssemblyInformationalVersionAttribute
          $config = ./scripts/read-assembly-stamp.ps1 -Path $carrier
          $framework = ./scripts/read-assembly-stamp.ps1 -Path $carrier -AttributeName TargetFrameworkAttribute
          if ($config -ne 'Release' -or $framework -ne '.NETFramework,Version=v4.7.2' -or $info -notmatch ('^0\.9\.[^+]+\+' + $head + '$')) { throw 'FL compiler input identity differs from the selected ordinary0.9/net472 source.' }
          New-Item -ItemType Directory -Path dist/verify-input -Force | Out-Null
          @{ repository='Coahuilite/FerriteLib'; commit=$head; configuration=$config; framework=$framework; informationalVersion=$info; sha256=(Get-FileHash $carrier).Hash } | ConvertTo-Json | Set-Content dist/verify-input/fl09.json
      - name: Verify existing US groups against the ordinary FL0.9 input
        shell: pwsh
        run: ./scripts/verify-local.ps1 -FerriteLibSourceRoot ci-ferritelib -FerriteLibArtifactPath ci-ferritelib/dist/build/Release/FerriteLib.UiKit.dll
      - name: Stage the verified RW1.6 payload (native1.7 remains local evidence)
        shell: pwsh
        run: |
          ./scripts/stage-package.ps1 -StageDir dist/ci/UniversalSqueaker -VersionLabel 0.6.0 -BuildFlavor release -CommitLabel $env:GITHUB_SHA -FerriteLibArtifactPath ci-ferritelib/dist/build/Release/FerriteLib.UiKit.dll -RequireReleaseIdentity
      - name: Preserve verification and source-input receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/verify/**
            dist/verify-input/**
          if-no-files-found: ignore
      - name: Privacy audit
        shell: pwsh
        run: ./scripts/privacy-audit.ps1
