name: CI

# Push/PR check for Universal Squeaker on a clean checkout. US compiles against the FerriteLib
# carrier (coahuilite.ferritelib) by a sibling relative path and never ships its copy, so the
# runner must reproduce that sibling layout before the gates run. A green run here means US is
# internally sound against a freshly built carrier, not that the carrier itself is sound (that is
# the carrier repo's own CI).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push cancels the in-flight check of the same branch instead of spending Windows minutes on
# a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    # The 14-gate suite is seconds of work; the minute is runner startup. A hung runner should burn
    # 10, not the 360 default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The carrier source checkout, pinned at the release tag - NEVER the default branch. It provides
      # the harness support the sibling tree must carry (the stub-coverage scanner and the licence) and
      # the commit gate 6 pairs the payload against. The repository name is a build contract: it must
      # equal the carrier repo's real GitHub name, which the maintainer fixes when creating it.
      - name: Checkout the FerriteLib carrier source at the pinned release tag
        uses: actions/checkout@v4
        with:
          repository: Coahuilite/FerriteLib
          ref: v0.7.0-rc1
          path: ci-ferritelib

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Self-measured, not copied: the local default SDK (no global.json) is 10.0.204 and every
          # gate's evidence was produced on it, so the runner reproduces that machine. US also builds
          # green under 8.0.424 on a clean restore (measured), but an obj/ restored by one SDK major
          # fails NETSDK1047 when the other builds it, so pinning to the proven major keeps CI and the
          # local evidence identical. net472 targeting resolves from NuGet (Krafs.Rimworld.Ref) either way.
          dotnet-version: '10.0.x'

      # Dependency chain (decision recorded in MEMORY.md "First cloud upload: durable decisions" and the
      # 2026-10-09 carrier-acquisition route). actions/checkout resolves `path` INSIDE GITHUB_WORKSPACE and
      # rejects anything outside it, so the carrier SOURCE lands in a workspace subdir and a run step - not
      # bound by the checkout guard - stages it at the sibling path the csproj HintPath and verify-local
      # gate 6 both expect:
      #   US root = <run>/UniversalSqueaker/UniversalSqueaker ; sibling = <run>/UniversalSqueaker/ferritelib
      # The WHOLE source tree (minus .git) is staged because the sibling contract needs more than the
      # payload: verify-local's licence gate compares ferritelib/LICENSE byte-for-byte and gate 15 runs the
      # carrier's reference-driven scanner (ferritelib/scripts/stub-coverage-scan.ps1). The COMPILE PAYLOAD,
      # however, is never built here: coahuilite.ferritelib is the single carrier and this workflow consumes
      # the AUTHORITATIVE CI-built release asset (explicit repo+tag, digest-verified, closed payload set,
      # commit paired against the pinned checkout) - a second FerriteLib runtime build would be a second
      # carrier that binds by load order through the game's global AssemblyResolve with no detector for the
      # loser. The helper stages the verified DLL exactly where HintPath looks.
      - name: Acquire the FerriteLib release carrier (v0.7.0-rc1) and stage the sibling tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sibling = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'ferritelib'
          New-Item -ItemType Directory -Path $sibling -Force | Out-Null
          Get-ChildItem -LiteralPath 'ci-ferritelib' -Force |
            Where-Object { $_.Name -ne '.git' } |
            Copy-Item -Destination $sibling -Recurse -Force
          ./scripts/acquire-ferritelib-carrier.ps1 -Repo 'Coahuilite/FerriteLib' -Tag 'v0.7.0-rc1' -SourceCheckout 'ci-ferritelib' -SiblingRoot $sibling
          # US never authors or builds the carrier: nothing in this workflow writes into ci-ferritelib/.

      - name: Restore
        shell: pwsh
        run: |
          # verify-local's six harness gates each run `dotnet run --no-restore`, so every project
          # they touch needs an obj/ from a restore on a clean checkout (locally the obj/ already
          # exists, which is why -NoRestore passes here but would not on the runner). Glob rather
          # than a hand list so a new tools/ project can never be forgotten.
          Get-ChildItem -Path Source,tools -Recurse -Filter *.csproj |
            ForEach-Object { dotnet restore $_.FullName --nologo }

      - name: Verify (15 gates)
        shell: pwsh
        # The carrier is SELECTED, never defaulted: resolve-carrier refuses an empty path since 2026-09-24
        # (a silent pick of the repository-root Release payload was the wrong artifact for a Dev rehearsal).
        # The acquisition step above staged the verified release-asset DLL exactly here - the sibling path
        # the csproj HintPath also resolves - and gate 6 pairs its embedded commit against the pinned
        # ci-ferritelib checkout.
        run: ./scripts/verify-local.ps1 -NoRestore -FerriteLibArtifactPath '../ferritelib/1.6/Assemblies/FerriteLib.UiKit.dll'

      # The privacy gate is a first-upload concern and cheap; run it on every CI pass so a personal
      # path or credential can never ride a commit to main. Full-history mode is reserved for the
      # pre-push manual check (the runner clone is shallow and would not carry the history to scan).
      - name: Privacy audit (working tree + commit messages + identity)
        shell: pwsh
        run: ./scripts/privacy-audit.ps1
